[package]
name = "cliente-gestor"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cripto de la bóveda (RF-01, RF-16)
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
# Almacenamiento local (bóveda en archivo único)
rusqlite = { version = "0.31", features = ["bundled"] }
# MFA local (RF-11)
totp-rs = "5"
# Firma de eventos de auditoría (RF-08)
jsonwebtoken = "9"

[[bin]]
name = "cliente-gestor"
path = "src/main.rs"
