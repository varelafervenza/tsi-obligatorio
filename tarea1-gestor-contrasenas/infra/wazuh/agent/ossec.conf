<!-- Agente que lee el JSONL del control central. Los placeholders los reemplaza
     la imagen al arrancar (WAZUH_MANAGER_SERVER, WAZUH_AGENT_NAME). -->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
    </enrollment>
  </client>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/control-central/audit-events.jsonl</location>
    <only-future-events>yes</only-future-events>
  </localfile>
</ossec_config>
