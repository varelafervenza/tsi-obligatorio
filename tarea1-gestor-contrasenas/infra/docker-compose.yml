version: "3.8"

# Levantar desde ESTA carpeta:
#   cd infra
#   docker compose up --build -d
# O desde la raíz de la tarea (compose.yaml con include):
#   docker compose up --build -d
#
# Stack del control central. Mailu se despliega aparte (infra/mailu/README.md).
# Wazuh (manager + agente que lee el JSONL) sube con este compose. Sin indexer:
# ver infra/wazuh/README.md.

networks:
  blue-team-net:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  wazuh-alerts:

services:
  control-central:
    build: ../control-central
    env_file: ./control-central.env
    ports:
      - "8001:8000"
    volumes:
      - ./logs:/var/log/control-central
      - ../keys/agentes:/app/keys/agentes:ro
      - wazuh-alerts:/var/log/wazuh-alerts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blue-team-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_central}
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    # Sin ports: la base solo es alcanzable en blue-team-net (R13). Grafana y la API usan postgres:5432.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d control_central"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blue-team-net

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - blue-team-net

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-control_central}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blue-team-net

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.8
    hostname: wazuh.manager
    ulimits:
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ./wazuh/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      - ./wazuh/manager/01-laboratorio.sh:/entrypoint-scripts/01-laboratorio.sh:ro
      - wazuh-alerts:/var/ossec/logs/alerts
    networks:
      - blue-team-net
    healthcheck:
      # wazuh-control status sale 1 porque clusterd, maild y otros no aplican acá.
      test: ["CMD-SHELL", "pgrep -x wazuh-analysisd >/dev/null && pgrep -x wazuh-remoted >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.8
    hostname: agente-control-central
    environment:
      WAZUH_MANAGER_SERVER: wazuh-manager
      WAZUH_AGENT_NAME: agente-control-central
    volumes:
      - ./logs:/var/log/control-central
      - ./wazuh/agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./wazuh/agent/01-permisos.sh:/entrypoint-scripts/01-permisos.sh:ro
    depends_on:
      wazuh-manager:
        condition: service_healthy
    networks:
      - blue-team-net

  thehive:
    profiles: ["thehive"]
    image: strangebee/thehive:5.2
    ports:
      - "9000:9000"
    networks:
      - blue-team-net
    # No se levanta con `docker compose up`. Requiere Cassandra + Elasticsearch;
    # ver infra/thehive/README.md. Activar con: --profile thehive
