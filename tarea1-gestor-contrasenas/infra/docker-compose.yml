version: "3.8"

# Levantar desde ESTA carpeta:
#   cd infra
#   docker compose up --build -d
# O desde la raíz de la tarea (compose.yaml con include):
#   docker compose up --build -d
#
# Stack del control central. Wazuh y Mailu se despliegan con sus propios
# instaladores/compose oficiales (ver infra/wazuh/README.md e infra/mailu/README.md)
# y se conectan a esta misma red `blue-team-net`.

networks:
  blue-team-net:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:

services:
  control-central:
    build: ../control-central
    env_file: ./control-central.env
    ports:
      - "8001:8000"
    volumes:
      - ./logs:/var/log/control-central
      - ../keys/agentes:/app/keys/agentes:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blue-team-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_central}
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d control_central"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blue-team-net

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - blue-team-net

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-control_central}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blue-team-net

  thehive:
    profiles: ["thehive"]
    image: strangebee/thehive:5.2
    ports:
      - "9000:9000"
    networks:
      - blue-team-net
    # No se levanta con `docker compose up`. Requiere Cassandra + Elasticsearch;
    # ver infra/thehive/README.md. Activar con: --profile thehive
