name: release

# Publica el instalador NSIS como asset de un GitHub Release al pushear un tag v* (ej. v1.0).
# A diferencia del artefacto de `cliente-gestor.yml` (vence a los 90 días y exige estar
# logueado en GitHub para bajarlo), el asset de un Release tiene un link fijo y lo puede
# bajar cualquiera sin login, aunque el repo sea público.
#
# Separado de `cliente-gestor.yml` a propósito: ese workflow filtra por `paths`, y el push
# de un tag sobre un commit ya existente no siempre dispara los workflows que combinan
# `tags` con `paths` en el mismo evento `push`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tarea1-gestor-contrasenas/cliente-gestor/package-lock.json

      - run: npm ci
        working-directory: tarea1-gestor-contrasenas/cliente-gestor

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tarea1-gestor-contrasenas/cliente-gestor/src-tauri

      - name: Generar instalador NSIS
        working-directory: tarea1-gestor-contrasenas/cliente-gestor
        run: npx tauri build --bundles nsis

      - name: Publicar el instalador en el Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          tarea1-gestor-contrasenas/cliente-gestor/src-tauri/target/release/bundle/nsis/*.exe
          --title "${{ github.ref_name }}"
          --generate-notes
